# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    uses: ./.github/workflows/reusable-build-and-test.yml
    with:
      os: ${{ matrix.os }}
    secrets: inherit