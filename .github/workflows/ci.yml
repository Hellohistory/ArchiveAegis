# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-ubuntu:
    uses: ./.github/workflows/reusable-build-and-test.yml
    with:
      os: ubuntu-latest
    secrets: inherit

  build-macos:
    uses: ./.github/workflows/reusable-build-and-test.yml
    with:
      os: macos-latest
    secrets: inherit

  build-windows:
    uses: ./.github/workflows/reusable-build-and-test.yml
    with:
      os: windows-latest
    secrets: inherit