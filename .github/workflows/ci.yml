name: Build & Test (Multi-OS)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    env:
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23
          cache: false

      - name: Cache Go modules & build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ${{ env.GOMODCACHE }}
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Download Go modules
        run: go mod download

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@v4
        with:
          path: ~/protoc
          key: protoc-25.3-${{ runner.os }}

      - name: Install Protobuf Compiler
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        uses: arduino/setup-protoc@v2
        with:
          version: 25.3
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go protobuf plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "${HOME}/go/bin" >> $GITHUB_PATH
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            test_script/requirements-ci.txt

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install -q --upgrade pip
          if [[ -f requirements-ci.txt ]]; then
            python -m pip install -q -r requirements-ci.txt
          elif [[ -f test_script/requirements-ci.txt ]]; then
            python -m pip install -q -r test_script/requirements-ci.txt
          else
            python -m pip install -q grpcio grpcio-tools requests
          fi

      - name: Generate protobuf files
        run: task gen

      - name: Run go vet & govulncheck
        run: |
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Find changed Go/proto files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.go
            **/*.proto

      - name: Run unit tests (affected packages)
        if: steps.changed.outputs.any_changed == 'true'
        shell: bash
        run: |
          PKGS=$(echo "${{ steps.changed.outputs.all_changed_files }}" \
                 | xargs -n1 dirname \
                 | sort -u \
                 | sed 's|^|./|')
          echo "Packages to test: $PKGS"
          if [[ -n "$PKGS" ]]; then
            go test -v -race -failfast $PKGS
          else
            echo "No affected packages."

      - name: Build ArchiveAegisCore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AegisBuild
          EXT=$([[ "${{ runner.os }}" == "Windows" ]] && echo ".exe" || echo "")
          detect_target() {
            for p in ./cmd/core ./cmd/ArchiveAegisCore ./cmd/gateway ./cmd ./ ; do
              if [[ -f "$p/main.go" ]]; then
                echo "$p"; return
              fi
            done
            echo "::error::未找到入口包 main.go" >&2
            exit 1
          }
          TARGET=$(detect_target)
          echo "Detected entry package: $TARGET"
          go build -o "AegisBuild/ArchiveAegisCore${EXT}" "$TARGET"

      - name: Disable Windows Defender
        if: runner.os == 'Windows'
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Run e2e rate-limit test
        shell: bash
        env:
          AEGIS_BIN: ${{ github.workspace }}/AegisBuild/ArchiveAegisCore${{ runner.os == 'Windows' && '.exe' || '' }}
          AEGIS_BASE_URL: http://localhost:10224/api/v1
        run: python test_script/test_ratelimit.py

      - name: Re-enable Windows Defender
        if: runner.os == 'Windows' && always()
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $false

      - name: Check for uncommitted generated files
        shell: bash
        run: |
          # 忽略在 Windows 上因换行符(CRLF)不同而产生的 git status 变化
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            git config core.autocrlf false
          fi
          
          if [[ -n "$(git status --porcelain | grep -v '^??')" ]]; then
            echo "::error::Protobuf 编译文件未提交！请运行 'task gen' 并提交。"
            git --no-pager diff
            exit 1
          else
            echo "✅ Protobuf 文件已是最新，无需提交。"
          fi

      - name: All checks passed
        run: echo "✅🎉 全平台 CI 全部通过！"
