# .github/workflows/reusable-build-and-test.yml
name: Reusable Build & Test

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

jobs:
  build-test:
    runs-on: ${{ inputs.os }}

    steps:
      - name: 拉取代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: 缓存 Go 模块和构建缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ inputs.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ inputs.os }}-

      - name: 下载 Go 模块
        run: go mod download

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: 'ci_test/requirements-ci.txt'

      - name: 安装 Python 依赖
        run: |
          python -m pip install -q --upgrade pip
          # 为 Protobuf 生成和 E2E 测试安装依赖
          if [[ -f ci_test/requirements-ci.txt ]]; then
            python -m pip install -q -r ci_test/requirements-ci.txt
          else
            echo "::warning::未找到 ci_test/requirements-ci.txt，将安装默认依赖。"
            python -m pip install -q grpcio grpcio-tools requests
          fi
        shell: bash

      - name: 检查未提交的生成文件
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            git config core.autocrlf false
          fi
          # 检查 Go 生成文件
          if [[ -n "$(git status --porcelain | grep '\.pb\.go')" ]]; then
            echo "::error::Protobuf Go 编译文件未提交！请运行 'task gen' 并提交变更。"
            git --no-pager diff
            exit 1
          else
            echo "✅ Protobuf Go 文件已是最新。"
          fi
        shell: bash

      - name: 执行 GolangCI-Lint 检查
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          install-mode: binary
          github-token: ${{ secrets.GITHUB_TOKEN }}
          only-new-issues: false
          skip-cache: false

      - name: 执行 Go 漏洞扫描
        uses: golang/govulncheck-action@v1

      - name: 安装 Task 工具
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 缓存并安装 Protobuf 编译器
        id: cache-protoc
        uses: actions/cache@v4
        with:
          path: ~/protoc
          key: protoc-25.3-${{ inputs.os }}

      - name: 安装 Protobuf 编译器（如未缓存）
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        uses: arduino/setup-protoc@v2
        with:
          version: '25.3'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 Go 的 protobuf 插件
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "${HOME}/go/bin" >> $GITHUB_PATH
        shell: bash

      - name: 生成 Protobuf 文件
        id: gen_proto
        run: task gen

      - name: 构建 ArchiveAegisCore 可执行文件
        id: build
        run: |
          set -euo pipefail
          mkdir -p AegisBuild
          EXT=$([[ "${{ runner.os }}" == "Windows" ]] && echo ".exe" || echo "")
          detect_target() {
            for p in ./cmd/core ./cmd/ArchiveAegisCore ./cmd/gateway ./cmd ./ ; do
              if [[ -f "$p/main.go" ]]; then
                echo "$p"; return
              fi
            done
            echo "::error::未找到入口文件 main.go" >&2
            exit 1
          }
          TARGET=$(detect_target)
          echo "检测到入口包: $TARGET"
          go build -o "AegisBuild/ArchiveAegisCore${EXT}" "$TARGET"
          echo "binary_path=${{ github.workspace }}/AegisBuild/ArchiveAegisCore${EXT}" >> $GITHUB_OUTPUT
        shell: bash

      - name: 获取变更的文件（用于单元测试）
        uses: tj-actions/changed-files@v44
        id: changed-go-files
        with:
          files: |
            **/*.go
            **/*.proto

      - name: 执行单元测试并生成覆盖率报告
        if: steps.changed-go-files.outputs.any_changed == 'true'
        run: go test -v -race -failfast -coverprofile=coverage.out -covermode=atomic ./...
        shell: bash

      - name: 转换测试覆盖率为 HTML 报告
        if: steps.changed-go-files.outputs.any_changed == 'true'
        run: go tool cover -html=coverage.out -o coverage-report.html
        shell: bash

      - name: 上传覆盖率报告
        if: steps.changed-go-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ inputs.os }}
          path: coverage-report.html
          retention-days: 7

      - name: 检查是否有影响端到端测试的改动
        id: e2e_changes
        uses: tj-actions/changed-files@v44
        with:
          files: |
            ci_test/test_ratelimit.py
            cmd/**
            internal/**
            pkg/**
            go.mod
            go.sum

      - name: 配置 Windows 环境以进行端到端测试
        if: runner.os == 'Windows' && steps.e2e_changes.outputs.any_changed == 'true'
        run: |
          echo "正在禁用 Windows Defender 实时监控..."
          Set-MpPreference -DisableRealtimeMonitoring $true
          echo "正在添加防火墙规则以开放端口 10224..."
          New-NetFirewallRule -DisplayName "Allow Aegis Test Port" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 10224
          # 增加 E2E 测试的超时时间
          (Get-Content ci_test/test_ratelimit.py) -replace '_wait_until_ready\(timeout=45\)', '_wait_until_ready(timeout=120)' | Set-Content -Encoding UTF8 ci_test/test_ratelimit.py
        shell: powershell

      - name: 执行端到端限流测试
        if: steps.e2e_changes.outputs.any_changed == 'true'
        run: python ci_test/test_ratelimit.py
        shell: bash
        env:
          AEGIS_BIN: ${{ steps.build.outputs.binary_path }}
          AEGIS_BASE_URL: http://localhost:10224/api/v1

      - name: 清理 Windows 测试环境
        if: runner.os == 'Windows' && always() && steps.e2e_changes.outputs.any_changed == 'true'
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $false
          Write-Host "Windows Defender 实时监控已重新启用。"
          $rule = Get-NetFirewallRule -DisplayName "Allow Aegis Test Port" -ErrorAction SilentlyContinue
          if ($rule) {
            Remove-NetFirewallRule -DisplayName "Allow Aegis Test Port"
            Write-Host '已移除防火墙规则 "Allow Aegis Test Port"。'
          }

      - name: 所有检查通过
        run: echo "✅🎉 ${{ inputs.os }} 的 CI 流程已全部成功通过！"