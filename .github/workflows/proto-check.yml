# .github/workflows/proto-check.yml
name: Build & Check Proto

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true


      - name: Download Go module dependencies
        run: go mod download


      - name: Install Task (cross-platform)
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}   # ← 防 API 限速


      - name: Install Protobuf Compiler
        uses: arduino/setup-protoc@v2
        with:
          version: '25.3'
          repo-token: ${{ secrets.GITHUB_TOKEN }}


      - name: Install Go protobuf plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "${HOME}/go/bin" >> $GITHUB_PATH


      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install Python gRPC tools
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q grpcio grpcio-tools


      - name: Generate protobuf files
        run: task gen


      - name: Find changed test files
        id: changed_tests
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*_test.go


      - name: Run tests on changed packages
        if: steps.changed_tests.outputs.any_changed == 'true'
        run: |
          PKGS=$(echo "${{ steps.changed_tests.outputs.all_changed_files }}" \
            | xargs -n1 dirname \
            | sort -u \
            | sed 's|^|./|' )
          echo "Running tests for: $PKGS"
          if [ -n "$PKGS" ]; then
            go test -v -race $PKGS
          fi

      - name: Check for uncommitted generated files
        run: |
          if [[ -n "$(git status --porcelain | grep -v '^??')" ]]; then
            echo "::error::Protobuf 编译文件未提交！请运行 'task gen' 并提交。"
            git --no-pager diff
            exit 1
          else
            echo "✅ Protobuf 文件已是最新，无需提交。"
          fi

      # 12. Success
      - name: All checks passed
        run: echo "✅🎉 Proto workflow finished successfully!"
